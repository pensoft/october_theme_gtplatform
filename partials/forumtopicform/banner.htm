{# "Draft saved successfully" banner (Figma 1479:5522). Var: draftsUrl. #}
<div class="draft-banner" role="status">
    <div class="draft-banner__msg">
        <span class="draft-banner__text">Draft saved successfully</span>
        <span class="draft-banner__check" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="none">
                <path d="M3.5 8.4 6.4 11.3 12.5 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </span>
    </div>
    <a class="draft-banner__link" href="{{ draftsUrl }}">
        Go to drafts
        <svg viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </a>
</div>
